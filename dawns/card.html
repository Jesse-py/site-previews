<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Dawn's Victory Sports Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: "Source Sans 3", system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #e9e9ea; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.top { background: #222; width: 100%; padding: .12in 0; border-bottom: 8px solid #9e2d2d; }
.top img { height: 1.45in; display: block; margin: 0 auto; }
h1 { font-family: Caprasimo, serif; font-weight: 400; color: #7f2424; font-size: 32px; margin: 12px 0 0; line-height: 1.1; }
.sub { margin: 2px 0 8px; color: #333; font-size: 14px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 12px; color: #333; margin: 6px 0 0; line-height: 1.35; }
.phone { font-weight: 700; font-size: 18px; color: #7f2424; margin: 3px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/logo-520.webp" alt="Dawn's Victory Sports Cafe logo"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish and price, right on your phone.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens the Dawn's Victory Sports Cafe menu">
  <p class="hours">Mon 4 PM–12 AM · Tue–Wed 11:30 AM–12 AM<br>Thu–Fri 11:30 AM–2 AM · Sat 4 PM–2 AM · Sun 12 PM–Close</p>
  <p class="phone">(518) 463-9113</p>
</div>
</body></html>
