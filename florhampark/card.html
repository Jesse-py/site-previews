<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Florham Park Diner</title>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: "Source Sans 3", system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #fbf6ea; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.top { background: #111; width: 100%; padding: .1in 0; border-bottom: 8px solid #c20000; }
.top img { height: 1.45in; display: block; margin: 0 auto; border-radius: 6px; }
h1 { font-family: "Libre Baskerville", Georgia, serif; color: #a30000; font-size: 27px; margin: 14px 0 0; line-height: 1.1; }
.sub { margin: 4px 0 8px; color: #333; font-size: 14px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 13px; color: #333; margin: 6px 0 0; line-height: 1.35; }
.phone { font-weight: 700; font-size: 18px; color: #a30000; margin: 3px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/logo.webp" alt="Florham Park Diner logo"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish and price, right on your phone.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens the Florham Park Diner menu">
  <p class="hours">Mon–Sat 7 AM–10 PM · Sun 7 AM–9 PM</p>
  <p class="phone">(973) 966-1008</p>
</div>
</body></html>
