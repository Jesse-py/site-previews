<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | The Portage Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Jost:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: Jost, system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #f4efe3; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.top { background: #000; width: 100%; }
.top img { height: 1.75in; display: block; margin: 0 auto; }
.check { width: 100%; height: 12px; background: repeating-linear-gradient(90deg, #e2732c 0 12px, #fff 12px 24px); }
h1 { font-family: Yellowtail, cursive; font-weight: 400; color: #14524c; font-size: 40px; margin: 8px 0 0; line-height: 1.1; }
.sub { margin: 0 0 8px; color: #333; font-size: 14px; }
.qr { width: 1.75in; height: 1.75in; }
.hours { font-size: 12.5px; color: #333; margin: 6px 0 0; line-height: 1.45; }
.phone { font-weight: 700; font-size: 18px; color: #c45a17; margin: 4px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/sign-480.webp" alt="The Portage Cafe neon sign"></div>
  <div class="check"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish and price, plus today’s special, on your phone.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens The Portage Cafe menu">
  <p class="hours">Mon–Sat 6 AM–1 PM · Sun 7 AM–1 PM</p>
  <p class="phone">(608) 566-1543</p>
</div>
</body></html>
