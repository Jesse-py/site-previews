<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Burger Box</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: Inter, system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.top { background: #363636; width: 100%; padding: .14in 0; border-bottom: 8px solid #a4501a; }
.top img { height: 1.4in; display: block; margin: 0 auto; }
h1 { font-family: Oswald, sans-serif; font-weight: 600; text-transform: uppercase; color: #111; font-size: 30px; margin: 12px 0 0; line-height: 1.1; }
.sub { margin: 2px 0 8px; color: #333; font-size: 13.5px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 12px; color: #333; margin: 6px 0 0; line-height: 1.35; }
.phone { font-family: Oswald, sans-serif; font-weight: 600; font-size: 19px; color: #a4501a; margin: 3px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/logo-520.webp" alt="Burger Box logo"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every burger and price, right on your phone.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens the Burger Box menu">
  <p class="hours">Mon–Tue 4:30–8:30 PM · Wed closed<br>Thu–Sat 12–8:30 PM · Sun 12–8 PM</p>
  <p class="phone">(845) 633-8637</p>
</div>
</body></html>
