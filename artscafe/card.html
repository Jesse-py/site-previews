<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Art's Cafe</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: "Open Sans", system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #f7f3ee; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.top { background: #3a2416; width: 100%; padding: .16in 0; }
.top img { height: 1.3in; display: block; margin: 0 auto; }
h1 { font-family: Oswald, sans-serif; font-weight: 500; color: #231f20; font-size: 32px; margin: 12px 0 0; line-height: 1.1; }
.sub { margin: 2px 0 8px; color: #333; font-size: 13.5px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 12px; color: #333; margin: 6px 0 0; line-height: 1.35; }
.phone { font-family: Oswald, sans-serif; font-weight: 500; font-size: 19px; color: #6e3a1f; margin: 3px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/logo-480.webp" alt="Art's Cafe logo"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish, drink and price, plus today's bread.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens the Art's Cafe menu">
  <p class="hours">Tue 8 AM–4 PM · Wed–Fri 8 AM–8 PM<br>Sat 8 AM–4 PM · Closed Sun & Mon</p>
  <p class="phone">(716) 592-9036</p>
</div>
</body></html>
