<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Trevino's</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: 'Source Sans 3', system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #fdf3ec; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; }
.top { background: #17183a; width: 100%; }
.top img { width: 100%; height: 1.9in; object-fit: cover; display: block; }
h1 { font-family: Oswald, sans-serif; font-weight: 600; color: #b3302a; font-size: 30px; margin: 14px 0 2px; letter-spacing: .02em; }
.sub { margin: 0 0 8px; color: #3a2a20; font-size: 14px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 12px; color: #3a2a20; margin: 8px 0 0; line-height: 1.45; }
.phone { font-family: Oswald, sans-serif; font-size: 18px; color: #17183a; margin: 6px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/sign-640.webp" alt="Trevino's Mexican Restaurant"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish and price on your phone. Small town. Big taste.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens Trevino's menu">
  <p class="hours">Wed–Thu 4:30–8 PM · Fri 4–9 PM · Sat 12–9 PM<br>Sun–Tue closed</p>
  <p class="phone">(405) 387-3221</p>
</div>
</body></html>
