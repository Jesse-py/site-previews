<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Abruzzo Italian Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: "Source Sans 3", system-ui, sans-serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #f8f8f8; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden;
  border: 10px solid #e0f0e8; outline: 2px solid #a0d0c0; outline-offset: -12px; }
.top { width: 100%; padding: .22in 0 .08in; }
.top img { width: 2.6in; display: block; margin: 0 auto; }
h1 { font-family: "Josefin Sans", sans-serif; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #b8322f; font-size: 26px; margin: 10px 0 0; }
.sub { margin: 2px 0 8px; color: #333; font-size: 14px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 12.5px; color: #333; margin: 6px 0 0; line-height: 1.35; }
.phone { font-weight: 700; font-size: 18px; color: #b8322f; margin: 3px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/logo-560.webp" alt="Abruzzo Italian Kitchen logo"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish, cocktail and wine, right on your phone.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens the Abruzzo Italian Kitchen menu">
  <p class="hours">Sunday–Thursday 5–9 PM<br>Friday &amp; Saturday 4:30–9:30 PM</p>
  <p class="phone">406.730.8767</p>
</div>
</body></html>
