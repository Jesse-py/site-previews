<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Table card | Tupelo Grille</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
@page { size: 4in 6in; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; background: #ddd; font-family: "EB Garamond", Georgia, serif; }
.card { width: 4in; height: 6in; margin: 0 auto; background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden;
  border: 6px solid #6f1e1e; outline: 1px solid #6f1e1e; outline-offset: -12px; }
.top { width: 100%; padding: .32in 0 .08in; }
.top img { width: 2.7in; display: block; margin: 0 auto; }
h1 { font-family: Oswald, sans-serif; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #6f1e1e; font-size: 25px; margin: 10px 0 0; }
.sub { margin: 2px 0 8px; color: #231f20; font-size: 15px; }
.qr { width: 1.8in; height: 1.8in; }
.hours { font-size: 14px; color: #231f20; margin: 6px 0 0; line-height: 1.3; }
.phone { font-family: Oswald, sans-serif; font-weight: 500; font-size: 19px; color: #6f1e1e; margin: 3px 0 0; }
@media print { body { background: none; } }
</style></head><body>
<div class="card">
  <div class="top"><img src="assets/logo-560.webp" alt="Tupelo Grille logo"></div>
  <h1>Scan for our menu</h1>
  <p class="sub">Every dish, cocktail and wine, right on your phone.</p>
  <img class="qr" src="assets/qr.svg" alt="QR code that opens the Tupelo Grille menu">
  <p class="hours">Dinner daily 5–9 PM<br>Sunday brunch 10 AM–2 PM</p>
  <p class="phone">406.862.6136</p>
</div>
</body></html>
